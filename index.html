<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procvičování vlastivědy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Nickname bar — non-intrusive, shown only when no nickname is set -->
  <div class="nickname-bar" id="nickname-bar" style="display:none">
    <form id="nickname-form" class="nickname-form">
      <span class="nickname-label">Zvol si přezdívku pro žebříček:</span>
      <input type="text" id="nickname-input" class="nickname-input" placeholder="Tvoje přezdívka" maxlength="20" autocomplete="off">
      <label class="nickname-hidden-label" title="Skrýt se v žebříčku ostatním">
        <input type="checkbox" id="nickname-hidden" class="nickname-hidden-cb">
        <span>Skrýt v žebříčku</span>
      </label>
      <button type="submit" class="btn btn-small btn-primary nickname-btn">Uložit</button>
      <button type="button" id="nickname-dismiss" class="nickname-dismiss" title="Zavřít">&times;</button>
    </form>
  </div>

  <div class="page-layout">
    <div class="container">
      <header class="header">
        <h1>Procvičování vlastivědy</h1>
        <p>Vyber si test a procvičuj!</p>
        <div id="global-stats" class="global-stats"></div>
      </header>
      <main class="card-grid" id="card-grid"></main>
    </div>

    <!-- Right sidebar card with tabs -->
    <aside class="sidebar-card" id="sidebar-card">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tab-badges" data-tab="badges">Odznaky</button>
        <button class="sidebar-tab" id="tab-leaderboard" data-tab="leaderboard">Žebříček</button>
      </div>
      <div class="sidebar-content">
        <div class="sidebar-pane active" id="pane-badges">
          <div id="badges-list" class="badges-list">
            <p class="loading">Načítání…</p>
          </div>
        </div>
        <div class="sidebar-pane" id="pane-leaderboard">
          <div id="leaderboard" class="leaderboard">
            <p class="loading">Načítání žebříčku…</p>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/tests/index.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
